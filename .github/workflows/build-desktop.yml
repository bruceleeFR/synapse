name: build-desktop

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: SYNAPSE-windows
          - os: macos-latest
            artifact: SYNAPSE-mac
          - os: ubuntu-22.04
            artifact: SYNAPSE-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Build
        run: pyinstaller synapse.spec
      - name: Package macOS app
        if: matrix.os == 'macos-latest'
        run: cd dist && zip -r SYNAPSE-mac.zip SYNAPSE.app
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/SYNAPSE
            dist/SYNAPSE.exe
            dist/SYNAPSE-mac.zip
          if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Stage release assets
        run: |
          mkdir -p out
          [ -f artifacts/SYNAPSE-linux/SYNAPSE ] && cp artifacts/SYNAPSE-linux/SYNAPSE out/SYNAPSE-linux || true
          [ -f artifacts/SYNAPSE-windows/SYNAPSE.exe ] && cp artifacts/SYNAPSE-windows/SYNAPSE.exe out/SYNAPSE.exe || true
          [ -f artifacts/SYNAPSE-mac/SYNAPSE-mac.zip ] && cp artifacts/SYNAPSE-mac/SYNAPSE-mac.zip out/SYNAPSE-mac.zip || true
          ls -la out
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          fail_on_unmatched_files: false
